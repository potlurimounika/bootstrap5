<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
<style>
    .demo-content
    {
        padding:15px;
        font-size:18px;
        background:#dbdfe5;
        margin-bottom:15px;
    }
    .demo-content.bg-alt
    {
        background:#abd158;
    }
</style>
</head>
<body>
    <h2 class="text-center mt-3">Bootstrap Responsive Layout</h2>
    <div class="text-center my-3">Open the Output in a new blank tab (click the arrow next to "show Output" button) and resize
        the browser window to understand how the Bootstrap responsive grid system works.
    </div>
    <div class="container">
        <!----Row with two equal columns---->
        <div class="row">
            <div class="col-md-6">
                <div class="demo content">.col-md-6</div>
            </div>
            <div class="col-md-6">
                <div class="demo content bg-alt">.col-md-6</div>
            </div>
            </div>
            <!----Row with two columns divided in 1:2 ratio---->
            <div class="row"><div class="col-md-4">
                <div class="demo-content">.col-md-4</div>
            </div>
            <div class="col-md-8">
                <div class="demo-content bg-alt">.col-md-8</div>
            </div>
        </div>
        <!----Row with two columns divided in 1:3 ratio---->
        <div class="row">
            <div class="col-md-3">
                <div class="demo-content">.col-md-3</div>
            </div>
            <div class="col-md-9">
                <div class="demo-content">.col-md-9</div>
            </div>
        </div>
    </div>
</body>
</html>
